<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>게임 기록장 (비공개)</title>
<style>
/* 비공개 화면. 조직·프로젝트 이름과 공고명이 들어 있어서 공개 사이트에는 lock.py 가 비밀번호로 잠근 자료(p/*.bin)만 올라간다 (원본 JSON 은 안 올림).
   자료는 game_private.json (game_book.py 가 매일 만든다). 이 PC에서  python -m http.server 8765 -d docs  로 연다. */
:root { color-scheme: light dark; --bg: #f2f4f6; --card: #fff; --text: #191f28; --text2: #4e5968; --muted: #8b95a1; --line: #e5e8eb; --ink: #3182f6; --up: #10b07f; --down: #f66d1c; --tint: #e8f3ff; }
@media (prefers-color-scheme: dark) { :root { --bg: #101013; --card: #1d1d22; --text: #f2f2f4; --text2: #c3c3c9; --muted: #8d8d96; --line: #2c2c34; --ink: #5a9cff; --up: #18a87a; --down: #f07a35; --tint: #1c2b45; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 24px; margin: 0; } h2 { font-size: 17px; margin: 0 0 4px; }
.warn { display: inline-block; background: var(--tint); color: var(--ink); font-weight: 600; font-size: 12px; padding: 3px 10px; border-radius: 99px; margin-bottom: 8px; }
.meta, .sub { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
.card { background: var(--card); border-radius: 18px; padding: 20px; margin-top: 14px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
select, input { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
label { color: var(--text2); font-size: 13px; }
.box { overflow: auto; max-height: 520px; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { position: sticky; top: 0; background: var(--card); color: var(--muted); white-space: nowrap; }
td.n { text-align: right; white-space: nowrap; } td.dim { color: var(--muted); white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 0 6px; margin-right: 4px; background: var(--tint); color: var(--ink); }
.up { color: var(--up); font-weight: 600; } .down { color: var(--down); font-weight: 600; }
.tabs { display: flex; gap: 4px; background: var(--card); border-radius: 14px; padding: 4px; width: fit-content; max-width: 100%; overflow-x: auto; margin-bottom: 18px; }
.tabs a { padding: 7px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--tint); color: var(--ink); }
a { color: var(--ink); text-decoration: none; }
</style>
</head>
<body>
<main>
  <nav class="tabs" aria-label="게임 업종 화면">
    <a href="explore/game.html">대시보드</a>
    <a href="game_jobs.html">공고 모아 보기</a>
    <a href="game_private.html" aria-current="page">기록장</a>
  </nav>
  <span class="warn">비공개 · 비밀번호로 여는 화면</span>
  <h1>게임 업종 기록장</h1>
  <p class="meta" id="meta">불러오는 중…</p>

  <section class="card">
    <h2>신규 사업 기록장</h2>
    <p class="sub">공고명 · 조직 칸에 나온 조직 · 프로젝트 이름마다 처음 본 날을 적어 둡니다. '처음부터'는 회사를 모으기 시작한 날 이미 있던 이름이라 언제 생겼는지 모릅니다.</p>
    <div class="bar">
      <label>회사 <select id="fCo"></select></label>
      <label><input type="checkbox" id="fNew"> 모으기 시작한 뒤 처음 본 이름만</label>
      <label><input type="checkbox" id="fGame"> 신작 관련만</label>
      <label><input type="checkbox" id="fOpen" checked> 열린 공고가 있는 것만</label>
      <input id="fQ" placeholder="이름 찾기">
      <span class="meta" id="nUnits" style="margin:0"></span>
    </div>
    <div class="box"><table id="tUnits"></table></div>
  </section>

  <section class="card">
    <h2>인력이동 표 · 직군별</h2>
    <p class="sub" id="sFlow"></p>
    <div class="box"><table id="tCat"></table></div>
  </section>

  <section class="card">
    <h2>인력이동 표 · 회사별 닫힌 공고와 새 공고</h2>
    <p class="sub">닫힌 공고가 사람이 옮겼다는 증거는 아닙니다 (추정에만 씁니다).</p>
    <div class="bar"><label>회사 <select id="fFlow"></select></label><label>직군 <select id="fCat"></select></label></div>
    <div class="box"><table id="tFlow"></table></div>
  </section>
</main>
<script src="lock.js"></script>
<script>
let P = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const href = u => /^https?:\/\//.test(u || "") ? u : "";
const a = (t, u) => href(u) ? `<a href="${esc(href(u))}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>` : esc(t);
const opts = (id, list, all) => { $(id).innerHTML = `<option value="">${all}</option>` + list.map(x => `<option>${esc(x)}</option>`).join(""); };

function units() {
  const co = $("fCo").value, q = $("fQ").value.trim().toLowerCase();
  const rows = P.units.filter(u => (!co || u.company === co) && (!$("fNew").checked || !u.from_start) && (!$("fGame").checked || u.new_game)
    && (!$("fOpen").checked || u.open) && (!q || (u.unit + " " + u.latest_title).toLowerCase().includes(q)));
  $("nUnits").textContent = rows.length + "개";
  $("tUnits").innerHTML = "<thead><tr><th>회사</th><th>조직 · 프로젝트 이름</th><th>처음 본 날</th><th>마지막으로 본 날</th><th>공고</th><th>열린</th><th>직군</th><th>가장 최근 공고</th></tr></thead><tbody>"
    + rows.map(u => `<tr><td class="dim">${esc(u.company)}</td><td>${u.new_game ? '<span class="tag">신작</span>' : ""}<b>${esc(u.unit)}</b></td>`
      + `<td class="dim">${u.from_start ? "처음부터" : esc(u.first_seen)}</td><td class="dim">${esc(u.last_seen)}</td><td class="n">${u.jobs}</td><td class="n">${u.open}</td>`
      + `<td class="dim">${esc(u.categories)}</td><td>${a(u.latest_title, u.url)}</td></tr>`).join("") + "</tbody>";
}

function flow() {
  const co = $("fFlow").value, cat = $("fCat").value, rows = [];
  for (const f of P.flow) {
    if (co && f.name !== co) continue;
    for (const [kind, list] of [["닫힘", f.closed], ["새 공고", f.new]])
      for (const j of list) if (!cat || j.category === cat) rows.push([j.date, f.name, kind, j]);
  }
  rows.sort((x, y) => y[0].localeCompare(x[0]));
  $("tFlow").innerHTML = "<thead><tr><th>날짜</th><th>회사</th><th>무엇</th><th>직군</th><th>조직</th><th>고용 형태</th><th>공고</th></tr></thead><tbody>"
    + rows.map(([d, n, k, j]) => `<tr><td class="dim">${esc(d)}</td><td class="dim">${esc(n)}</td><td class="${k === "닫힘" ? "down" : "up"}">${k}</td>`
      + `<td class="dim">${esc(j.category)}</td><td class="dim">${esc(j.team)}</td><td class="dim">${esc(j.emp_type)}</td><td>${a(j.title, j.url)}</td></tr>`).join("") + "</tbody>";
}

LOCK.json("game_private.json").then(d => {
  P = d;
  const fresh = d.units.filter(u => !u.from_start).length;
  $("meta").textContent = `${d.date} 기준 · 이름 ${d.units.length}개 (모으기 시작한 뒤 처음 본 이름 ${fresh}개) · 최근 ${d.days}일 움직임이 있는 회사 ${d.flow.length}곳`;
  opts("fCo", [...new Set(d.units.map(u => u.company))].sort(), "모든 회사");
  opts("fFlow", d.flow.map(f => f.name), "모든 회사");
  opts("fCat", d.categories.map(c => c.name), "모든 직군");
  $("sFlow").textContent = `최근 ${d.days}일 동안 직군마다 닫힌 공고와 새 공고, 그리고 많이 닫은 회사 · 많이 연 회사입니다.`;
  const top = l => l.map(x => `${esc(x[0])} ${x[1]}`).join(" · ") || "–";
  $("tCat").innerHTML = "<thead><tr><th>직군</th><th>새 공고</th><th>닫힌 공고</th><th>많이 연 회사</th><th>많이 닫은 회사</th></tr></thead><tbody>"
    + d.categories.map(c => `<tr><td><b>${esc(c.name)}</b></td><td class="n up">${c.new}</td><td class="n down">${c.closed}</td><td class="dim" style="white-space:normal">${top(c.top_new)}</td><td class="dim" style="white-space:normal">${top(c.top_closed)}</td></tr>`).join("") + "</tbody>";
  units(); flow();
}).catch(() => { $("meta").textContent = "game_private.json 을 못 읽었습니다. 먼저 python game_book.py 를 돌려 주세요."; });
for (const id of ["fCo", "fNew", "fGame", "fOpen"]) $(id).addEventListener("change", units);
$("fQ").addEventListener("input", units);
$("fFlow").addEventListener("change", flow); $("fCat").addEventListener("change", flow);
</script>
</body>
</html>
