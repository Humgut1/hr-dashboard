<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR 채용 데이터</title>
<!-- 사이트 맨 위 주소. 예전 대시보드 주소(#flow 같은 장 이름)는 회사 분석으로, #org 는 조직도로, 나머지는 시장 분석으로 넘긴다 -->
<script>
(() => {
  const h = location.hash;
  let to = "market/" + location.search;
  if (h === "#org") to = "org/";
  else if (h && h.length > 1) to = "company/" + h;
  location.replace(to);
})();
</script>
<meta http-equiv="refresh" content="0; url=market/">
</head><body style="font-family:sans-serif;padding:24px"><p><a href="market/">시장 분석</a> · <a href="company/">회사 분석</a></p></body></html>
